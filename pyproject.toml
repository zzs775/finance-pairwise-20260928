[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-reserve-engine"
version = "0.1.0"
description = "Annual term life insurance reserve engine (stdlib only)"
requires-python = ">=3.13"

[project.scripts]
life-reserve = "life_reserve.cli:main"

[tool.setuptools]
packages = ["life_reserve"]
