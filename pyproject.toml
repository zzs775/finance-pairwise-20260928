[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecl-engine"
version = "1.0.0"
description = "Rule-driven, Decimal-fixed-scale Expected Credit Loss engine (stdlib only)"
requires-python = ">=3.13"
readme = "README.md"

[project.scripts]
ecl-engine = "ecl_engine.cli:main"

[tool.setuptools]
packages = ["ecl_engine"]
