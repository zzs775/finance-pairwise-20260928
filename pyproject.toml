[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xbrlcheck"
version = "0.1.0"
description = "Local XBRL calculation-linkbase validator with interval arithmetic and versioned revisions (stdlib only)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []

[project.scripts]
xbrlcheck = "xbrlcheck.cli:main"

[tool.setuptools]
packages = ["xbrlcheck"]
