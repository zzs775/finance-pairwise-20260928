[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twr-engine"
version = "0.1.0"
description = "Standard-library time-weighted return engine with external cash flow interval splitting"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
twr-engine = "twr_engine.cli:main"

[tool.setuptools]
packages = ["twr_engine"]
